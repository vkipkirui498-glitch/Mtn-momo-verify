<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      color: #173f50;
    }

    .header {
      height: 285px;
      background: #07536b;
      border-radius: 0 0 50% 50% / 0 0 12% 12%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 35px;
    }

    .logo {
      text-align: center;
      color: #ffd52a;
      font-size: 26px;
      font-weight: bold;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 13px;
      background: #06445a;
      border: 2px solid #12617a;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      font-size: 30px;
    }

    .logo small {
      display: block;
      font-size: 11px;
    }

    .card {
      width: calc(100% - 36px);
      max-width: 440px;
      margin: -40px auto 0;
      position: relative;
      background: white;
      padding: 25px 20px;
      border-radius: 42px;
      box-shadow: 0 12px 28px rgba(0,0,0,.06);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 5px 0 28px;
      color: #07536b;
    }

    .phone-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .flag-box {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      border: 1px solid #333;
      border-radius: 23px;
      display: grid;
      place-items: center;
    }

    /* Round Uganda flag */
    .flag {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .stripe {
      height: 16.666%;
      width: 100%;
    }

    .black { background: #000; }
    .yellow { background: #f8d116; }
    .red { background: #d90000; }

    .crane {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      display: grid;
      place-items: center;
      font-size: 10px;
    }

    .phone-field {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .phone-field label {
      position: absolute;
      top: -10px;
      left: 16px;
      background: white;
      padding: 0 5px;
      font-size: 14px;
      color: #222;
    }

    input {
      width: 100%;
      height: 76px;
      padding: 14px;
      border: 1px solid #555;
      border-radius: 25px;
      font-size: 17px;
      outline-color: #1680ce;
    }

    .note {
      margin: 22px 0 0;
      text-align: center;
      color: #69757b;
      font-size: 13px;
      line-height: 1.6;
    }

    .next {
      width: calc(100% - 36px);
      max-width: 440px;
      margin: 40px auto 20px;
      display: block;
      height: 56px;
      border: none;
      border-radius: 32px;
      background: #07536b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    @media (max-width: 360px) {
      .card {
        padding: 22px 14px;
        border-radius: 32px;
      }

      h1 {
        font-size: 22px;
      }

      .flag-box {
        width: 64px;
        height: 68px;
      }

      input {
        height: 68px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">✓</div>
      Demo
      <small>VERIFICATION</small>
    </div>
  </header>

  <main class="card">
    <h1>Welcome</h1>

    <form id="demoForm">
      <div class="phone-row">
        <div class="flag-box" aria-label="Uganda flag">
          <div class="flag">
            <div class="stripe black"></div>
            <div class="stripe yellow"></div>
            <div class="stripe red"></div>
            <div class="stripe black"></div>
            <div class="stripe yellow"></div>
            <div class="stripe red"></div>
            <div class="crane">🐦</div>
          </div>
        </div>

        <div class="phone-field">
          <label for="phone">Test number *</label>
          <input
            id="phone"
            type="tel"
            inputmode="tel"
            placeholder="e.g. 700000000"
            autocomplete="off"
            required
          >
        </div>
      </div>

      <p class="note">
        Demo interface only. Do not enter financial PINs
        or other confidential information.
      </p>
    </form>
  </main>

  <button class="next" type="submit" form="demoForm">
    NEXT
  </button>

  <script>
    document.getElementById("demoForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Demo layout is working!");
    });
  </script>
</body>
</html>
