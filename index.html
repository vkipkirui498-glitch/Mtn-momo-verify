<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087b45">

  <title>Demo Verification</title>

  <style>
    :root {
      --green: #087b45;
      --green-dark: #056337;
      --background: #f3f6f4;
      --text: #202824;
      --muted: #68736c;
      --border: #dce4df;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 340px;
      padding: 24px 20px;
      background: var(--white);
      border: 1px solid #e9eeeb;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.055);
      text-align: center;
    }

    .brand {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #e6f5ec;
      color: var(--green);
      font-size: 25px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      line-height: 1.3;
    }

    .description {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid rgba(8, 123, 69, 0.15);
      border-color: var(--green);
    }

    button {
      width: 100%;
      min-height: 44px;
      padding: 11px 14px;
      border: none;
      border-radius: 9px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--green-dark);
    }

    button:focus-visible {
      outline: 3px solid #8ac9a8;
      outline-offset: 2px;
    }

    .secondary {
      margin-top: 10px;
      background: #edf2ee;
      color: var(--text);
    }

    .secondary:hover {
      background: #e1e9e3;
    }

    .hidden {
      display: none !important;
    }

    .demo-notice {
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 20px auto;
      border: 4px solid #e1eee6;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e6f5ec;
      color: var(--green);
      font-size: 28px;
    }

    .status-message {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    footer {
      margin-top: 20px;
      color: #8a948e;
      font-size: 11px;
    }

    @media (max-width: 360px) {
      .card {
        padding: 20px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Phone number screen -->
    <section id="phoneScreen">
      <div class="brand" aria-hidden="true">✓</div>

      <h1>Demo Verification</h1>

      <p class="description">
        Enter a test phone number to try the verification flow.
      </p>

      <form id="phoneForm">
        <div class="field">
          <label for="phone">Test phone number</label>

          <input
            id="phone"
            type="tel"
            inputmode="tel"
            autocomplete="off"
            placeholder="e.g. 0712 345 678"
            maxlength="20"
            required
          >
        </div>

        <button type="submit">Continue</button>
      </form>

      <p class="demo-notice">
        Demo only. Do not enter real financial credentials.
      </p>
    </section>

    <!-- Test code screen -->
    <section id="codeScreen" class="hidden">
      <div class="brand" aria-hidden="true">✓</div>

      <h1>Enter Test Code</h1>

      <p class="description">
        Enter the demo code <strong>00000</strong> to continue.
      </p>

      <form id="codeForm">
        <div class="field">
          <label for="testCode">Five-digit demo code</label>

          <input
            id="testCode"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="5"
            pattern="[0-9]{5}"
            placeholder="00000"
            required
          >
        </div>

        <button type="submit">Submit Demo Code</button>

        <button
          class="secondary"
          type="button"
          id="backButton"
        >
          Back
        </button>
      </form>

      <p class="demo-notice">
        This test page does not send entered codes to Telegram or a server.
      </p>
    </section>

    <!-- Waiting screen -->
    <section id="waitingScreen" class="hidden" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>

      <h1>Waiting for Approval</h1>

      <p class="description">
