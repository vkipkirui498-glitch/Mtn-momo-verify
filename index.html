<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07536b">

    * {
      box-sizing: border-box;

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

    }

    }

      height: 60px;
      margin: 0 auto 10px;

      font-size: 34px;
    }

    .brand small {
      display: block;
      font-size: 11px;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    }

      color: var(--teal);

    }
