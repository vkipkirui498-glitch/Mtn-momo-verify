<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07536b">

  <title>Demo Verification</title>

  <style>
    :root {
      --teal: #07536b;
      --background: #f2f3f5;
      --muted: #68736c;
      --green: #087b45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: #202124;
    }

    .header {
      height: 260px;
      background: var(--teal);
      border-radius: 0 0 50% 50% / 0 0 12% 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 30px;
    }

    .brand {
      text-align: center;
      color: #ffd52a;
      font-size: 25px;
      font-weight: 700;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 9px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #06445a;
      border: 2px solid #12617a;
      font-size: 28px;
    }

    .brand small {
      display: block;
      font-size: 10px;
      margin-top: 3px;
      letter-spacing: .7px;
    }

    .card {
      width: calc(100% - 32px);
      max-width: 430px;
      margin: -38px auto 0;
      position: relative;
      background: #fff;
      border-radius: 34px;
      padding: 24px 19px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .06);
    }

    h1 {
      margin: 4px 0 22px;
      text-align: center;
      color: var(--teal);
      font-size: 23px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
    }

    .phone-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .flag-box {
      flex: 0 0 70px;
      height: 70px;
      border: 1px solid #333;
      border-radius: 21px;
      display: grid;
      place-items: center;
    }

    .flag {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ddd;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .stripe {
      height: 16.666%;
      width: 100%;
    }

    .black {
      background: #000;
    }

    .yellow {
      background: #f8d116;
    }

    .red {
      background: #d90000;
    }

    .bird {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      display: grid;
      place-items: center;
      font-size: 9px;
    }

    .field {
      position: relative;
      min-width: 0;
      flex: 1;
    }

    .field label {
      position: absolute;
      top: -8px;
      left: 13px;
      padding: 0 5px;
      background: white;
      color: #222;
      font-size: 13px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 70px;
      border: 1px solid #555;
      border-radius: 22px;
      padding: 12px;
      font-size: 16px;
      outline-color: #1680ce;
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 12px 15px;
      border: 0;
      border-radius: 28px;
      background: var(--teal);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #80b9c8;
      outline-offset: 3px;
    }

    .bottom-button {
      display: block;
      width: calc(100% - 32px);
      max-width: 430px;
      margin: 30px auto 20px;
    }

    .secondary {
      margin-top: 10px;
      color: #24332b;
      background: #edf2ee;
    }

    .note,
    .message {
      text-align: center;
      color: var(--muted);
    }

    .note {
      font-size: 12px;
      margin: 18px 0 0;
    }

    .message {
      margin: 0 0 20px;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 14px auto 20px;
      border: 4px solid #dce9e3;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #e5f5eb;
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 29px;
    }

    @media (max-width: 360px) {
      .header {
        height: 235px;
      }

      .card {
        padding: 21px 14px;
        border-radius: 29px;
      }

      h1 {
        font-size: 21px;
      }

      .flag-box {
        flex-basis: 61px;
        height: 65px;
      }

      input {
        height: 65px;
        padding: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✓</div>
      Demo
      <small>VERIFICATION</small>
    </div>
  </header>

  <main class="card">

    <!-- PAGE 1: TEST NUMBER -->
    <section id="phoneScreen">
      <h1>Welcome</h1>

      <form id="phoneForm">
        <div class="phone-row">

          <div class="flag-box" aria-label="Uganda flag">
            <div class="flag" aria-hidden="true">
              <div class="stripe black"></
